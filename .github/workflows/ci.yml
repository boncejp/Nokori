name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで複数の CI が走ったとき、古い方をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Lint & 型チェック
  # ──────────────────────────────────────────────
  lint-typecheck:
    name: Lint & 型チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係インストール
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript 型チェック
        run: npm run typecheck

  # ──────────────────────────────────────────────
  # Vitest ユニットテスト
  # ──────────────────────────────────────────────
  unit-test:
    name: Vitest ユニットテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係インストール
        run: npm ci

      - name: テスト実行
        run: npm run test:run
        env:
          TZ: Asia/Tokyo

  # ──────────────────────────────────────────────
  # E2E 実行判定（ジョブ if では secrets を参照できないため step で判定）
  # ──────────────────────────────────────────────
  e2e-gate:
    name: E2E 実行判定
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.check.outputs.run_e2e }}
    steps:
      - id: check
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$E2E_TEST_EMAIL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && \
             [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────
  # Playwright E2E テスト
  # 上記ゲートで必要な Secrets が揃っている場合のみ実行
  # ──────────────────────────────────────────────
  e2e:
    name: Playwright E2E テスト
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-test, e2e-gate]
    if: needs.e2e-gate.outputs.run_e2e == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係インストール
        run: npm ci

      - name: Playwright ブラウザのインストール
        run: npx playwright install chromium --with-deps

      - name: アプリをビルド
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: アプリを起動
        run: npm run start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: アプリの起動を待機
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Playwright E2E テスト実行
        run: npm run test:e2e
        env:
          TZ: Asia/Tokyo
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}

      - name: テストレポートを保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
